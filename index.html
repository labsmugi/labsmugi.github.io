<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuGi Labs — Külliye</title>
<style>
  :root { --bg:#f7f7f6; --card:#fff; --text:#1a1a1a; --muted:#6b6b6b; --accent:#1b7a5f; --line:#e6e6e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1211; --card:#171b1a; --text:#eaeae7; --muted:#9a9a95; --accent:#4fbf9a; --line:#262b29; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
  .mark { width:56px; height:56px; border-radius:15px; background:var(--accent); color:#fff;
          display:grid; place-items:center; font-weight:700; font-size:28px; }
  h1 { font-size:28px; margin:20px 0 4px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin:20px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">ك</div>
  <h1>Külliye</h1>
  <p class="muted">Kıble pusulası, namaz vakitleri, Kur'an-ı Kerîm ve daha fazlası — sade, çevrimdışı, reklamsız.</p>
  <div class="card">
    <strong>Destek & İletişim</strong>
    <p>Soru, öneri veya hata bildirimi için:
       <a href="mailto:labsmugi@gmail.com">labsmugi@gmail.com</a></p>
    <p class="muted">Genellikle 1-2 gün içinde yanıt veriyoruz.</p>
  </div>
  <p><a href="privacy.html">Gizlilik Politikası / Privacy Policy</a></p>
  <p class="muted">© 2026 MuGi Labs</p>
</div>
</body>
</html>
