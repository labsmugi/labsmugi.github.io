# Ezan Vakti web pages: prayer times for Turkey's provinces and districts (ezan/).
# Runs every night at 00:30 Turkish time and runs .github/ezan-pages/build.py, which writes this month's
# pages. Pages only change when a new month starts, so most runs have nothing to commit.
# Python standard library only.
name: Ezan Vakti pages

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit (v4.4.0) so a moved tag can't run new code with this workflow's write access.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Malaysia's official times; only downloads a year that is missing or incomplete. A JAKIM outage
      # doesn't stop the pages (the step may fail; the build uses what is in the repo).
      - name: Fetch JAKIM timetables
        continue-on-error: true
        run: python3 .github/ezan-pages/fetch_jakim.py
      - name: Write this month's pages
        run: python3 .github/ezan-pages/build.py --root .
      - name: Commit and push
        id: commit
        run: |
          git config user.name "ezan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ezan .github/ezan-pages/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Ezan Vakti: pages for $(TZ=Europe/Istanbul date +%Y-%m)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
